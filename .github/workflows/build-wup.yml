name: Build WUP Chess

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out WUP Chess
        uses: actions/checkout@v4
        with:
          path: WUP-Chess

      - name: Check out libwup SDK
        uses: actions/checkout@v4
        with:
          repository: ravensclawx/wup-homebrew
          ref: main
          path: wup-homebrew

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm gcc python3 python3-pip python3-pil meson ninja-build

      - name: Run chess engine tests
        working-directory: WUP-Chess
        run: |
          gcc -std=c11 -O2 chess.c test_chess.c -o /tmp/test_chess
          /tmp/test_chess
          gcc -D_POSIX_C_SOURCE=200809L -std=c11 -O2 chess.c ai.c test_ai.c -o /tmp/test_ai
          /tmp/test_ai
          gcc -std=c11 -O2 rlink.c test_link.c -o /tmp/test_link
          /tmp/test_link

      - name: Build GamePad app
        working-directory: wup-homebrew
        run: |
          python3 libwup/tools/wupbuild.py ../WUP-Chess

      - name: Upload GamePad executable
        uses: actions/upload-artifact@v4
        with:
          name: wup-chess
          path: wup-homebrew/build/apps/wup_chess.wup
          if-no-files-found: error
          retention-days: 30
